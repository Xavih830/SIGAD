# A generic, single database configuration.

[alembic]
# path to migration scripts — relative to this file
script_location = alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# The database URL is set programmatically in env.py
# sqlalchemy.url is intentionally left blank here
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
