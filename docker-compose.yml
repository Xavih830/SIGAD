services:
  postgres:
    image: postgres:16-alpine
    container_name: sigad-postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigad_internal
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: "1.0"

  api:
    image: ${SIGAD_IMAGE:-ghcr.io/xavih830/sigadbackend}:${SIGAD_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigad-api
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$$ENVIRONMENT\" != \"production\" ]; then python -m scripts.seed_dev_data; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}"
    env_file:
      - .env
    volumes:
      - uploads_data:/backend/${UPLOAD_DIR:?Variable UPLOAD_DIR es requerida en .env}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigad_public
      - sigad_internal
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.75"

  worker:
    image: ${SIGAD_IMAGE:-ghcr.io/xavih830/sigadbackend}:${SIGAD_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigad-worker
    restart: always
    command: ["python", "-m", "app.workers.worker_entrypoint"]
    env_file:
      - .env
    volumes:
      - uploads_data:/backend/${UPLOAD_DIR:?Variable UPLOAD_DIR es requerida en .env}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigad_internal
    deploy:
      resources:
        limits:
          memory: 1800M
          cpus: "1.5"

  caddy:
    image: caddy:2-alpine
    container_name: sigad-caddy
    restart: always
    environment:
      - SIGAD_DOMAIN=${SIGAD_DOMAIN:-http://localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./build/web:/srv/flutter_web:ro
      - ./build/web:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - sigad_public
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: "0.5"


networks:
  sigad_public:
    driver: bridge
  sigad_internal:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
