name: SIGAD CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Evaluate Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.env.example'
              - 'openapi.json'
              - '.agents/rules/**'
            frontend:
              - 'lib/**'
              - 'test/**'
              - 'web/**'
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.env.client.example'
            infra:
              - 'Caddyfile'
              - 'docker-compose.yml'
            shared:
              - '.github/workflows/ci.yml'
              - '.gitignore'

  backend-validation:
    name: Backend Lint, Test Suite & OpenAPI Drift
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigad
          POSTGRES_PASSWORD: sigad_dev_2024
          POSTGRES_DB: sigad_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Configure Test Environment Variables (.env)
        run: |
          cp .env.example .env

      - name: Lint Backend with Ruff
        run: |
          pip install ruff
          ruff check backend

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa libtesseract-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov locust httpx

      - name: Run Database Migrations & Verification Cycle
        env:
          DATABASE_URL: postgresql+asyncpg://sigad:sigad_dev_2024@localhost:5432/sigad_db
          DATABASE_SYNC_URL: postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_db
        run: |
          python -c "import psycopg2; conn = psycopg2.connect(dbname='sigad_db', user='sigad', password='sigad_dev_2024', host='localhost', port=5432); conn.autocommit = True; cur = conn.cursor(); cur.execute('SELECT 1 FROM pg_database WHERE datname=\'sigad_test_db\''); not cur.fetchone() and cur.execute('CREATE DATABASE sigad_test_db OWNER sigad'); cur.close(); conn.close(); print('sigad_test_db verificada')"
          cd backend
          alembic upgrade head
          alembic downgrade base && alembic upgrade head
          DATABASE_SYNC_URL=postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_test_db alembic upgrade head

      - name: Execute Backend Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://sigad:sigad_dev_2024@localhost:5432/sigad_db
          DATABASE_SYNC_URL: postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_db
          JWT_SECRET_KEY: test-secret-key-32-chars-minimum-prod!
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Verify OpenAPI Schema Drift
        run: |
          python backend/scripts/export_openapi.py
          git diff --exit-code openapi.json

  flutter-validation:
    name: Flutter Static Analysis & Test Suite
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Test Suite
        run: flutter test --coverage

  build-backend-image:
    name: Build & Publish Backend Image to GHCR
    needs: [changes, backend-validation]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true') &&
      needs.backend-validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sigadbackend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image with Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend-and-apk:
    name: Build Flutter Web & Android APK
    needs: [changes, flutter-validation]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true') &&
      needs.flutter-validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: |
          flutter build web --release \
            --no-wasm-dry-run \
            --pwa-strategy=none \
            --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL || 'https://www.sigad.duckdns.org' }}

      - name: Build Android APK Release
        run: flutter build apk --release

      - name: Package Web & APK Clean Bundle
        run: |
          mkdir -p build/web/descargas
          cp build/app/outputs/flutter-apk/app-release.apk build/web/descargas/sigad.apk
          tar -czf /tmp/frontend-bundle.tar.gz -C build web

      - name: Upload Frontend & APK Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle
          path: /tmp/frontend-bundle.tar.gz
          retention-days: 1

  deploy-to-gcp:
    name: Zero-Waste Deploy to Google Cloud VPC
    needs: [changes, backend-validation, flutter-validation, build-backend-image, build-frontend-and-apk]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend & APK Bundle (if built)
        uses: actions/download-artifact@v4
        with:
          name: frontend-bundle
          path: /tmp
        continue-on-error: true

      - name: Deploy to GCP VM via SSH
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          GCP_DEPLOY_DIR: ${{ secrets.GCP_DEPLOY_DIR || '/opt/sigad' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' }}
          INFRA_CHANGED: ${{ needs.changes.outputs.infra == 'true' || needs.changes.outputs.shared == 'true' }}
        run: |
          if [ -z "$GCP_VM_HOST" ] || [ -z "$GCP_SSH_PRIVATE_KEY" ] || [ -z "$GCP_VM_USER" ]; then
            echo "::warning::Secretos de conexion a GCP no configurados. Se omite el despliegue."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$GCP_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$GCP_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "==> Sincronizando archivos base con el servidor remoto ($GCP_VM_HOST)..."
          ssh -o StrictHostKeyChecking=no "$GCP_VM_USER@$GCP_VM_HOST" "mkdir -p $GCP_DEPLOY_DIR"
          scp -o StrictHostKeyChecking=no docker-compose.yml Caddyfile "$GCP_VM_USER@$GCP_VM_HOST:$GCP_DEPLOY_DIR/"

          # Transferir el bundle de frontend solo si fue generado en esta ejecucion
          if [ -f "/tmp/frontend-bundle.tar.gz" ]; then
            echo "==> Transfiriendo nuevo bundle de Flutter Web y APK Android..."
            scp -o StrictHostKeyChecking=no /tmp/frontend-bundle.tar.gz "$GCP_VM_USER@$GCP_VM_HOST:/tmp/frontend-bundle.tar.gz"
          fi

          echo "==> Ejecutando orquestacion inteligente en la VM..."
          ssh -o StrictHostKeyChecking=no "$GCP_VM_USER@$GCP_VM_HOST" "bash -s" << EOF
            set -euo pipefail
            cd "$GCP_DEPLOY_DIR"

            # 1. Si llego nuevo bundle web, extraerlo en build/web
            if [ -f "/tmp/frontend-bundle.tar.gz" ]; then
              echo "==> Descomprimiendo nueva version de Flutter Web y APK Android..."
              mkdir -p build
              rm -rf build/web
              tar -xzf /tmp/frontend-bundle.tar.gz -C "$GCP_DEPLOY_DIR/build"
              rm -f /tmp/frontend-bundle.tar.gz
            fi

            # 2. Si cambio el Backend, descargar imagen actualizada de GHCR
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "==> Descargando nuevas imagenes de Backend desde GHCR..."
              if [ -n "$GHCR_PULL_TOKEN" ]; then
                echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              fi
              docker compose pull api worker
            fi

            # 3. Aplicar estado deseado de contenedores (idempotente)
            docker compose up -d --remove-orphans

            # 4. Si cambio el frontend o Caddyfile, reiniciar Caddy
            if [ "$FRONTEND_CHANGED" = "true" ] || [ "$INFRA_CHANGED" = "true" ]; then
              echo "==> Recargando Caddy para servir nuevos estaticos o configuracion..."
              docker compose restart caddy
            fi

            # 5. Limpieza de imagenes huerfanas para proteger el disco de 30GB
            docker image prune -f
            echo "==> Despliegue completado con exito."
          EOF
