name: SIGAD CI Pipeline

on:
  push:
    branches: [ main, v2, Sprint1 ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, v2 ]

jobs:
  lint-backend:
    name: Backend Linting & Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check backend

  backend-test:
    name: Backend Test Suite & Migrations
    needs: lint-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigad
          POSTGRES_PASSWORD: sigad_dev_2024
          POSTGRES_DB: sigad_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa libtesseract-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov locust httpx

      - name: Run Database Migrations & Verification Cycle
        env:
          DATABASE_URL: postgresql+asyncpg://sigad:sigad_dev_2024@localhost:5432/sigad_db
          DATABASE_SYNC_URL: postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_db
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base && alembic upgrade head

      - name: Execute Backend Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://sigad:sigad_dev_2024@localhost:5432/sigad_db
          DATABASE_SYNC_URL: postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_db
          JWT_SECRET_KEY: test-secret-key-32-chars-minimum-prod!
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing

  export-openapi:
    name: Export OpenAPI Contract & Verify Drift
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export OpenAPI Specification
        run: |
          python backend/scripts/export_openapi.py
          git diff --exit-code openapi.json

      - name: Upload OpenAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          retention-days: 1

  generate-client:
    name: Verify Client Models & OpenAPI Drift
    needs: export-openapi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OpenAPI Artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Test Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Client Generation & OpenAPI Drift
        run: |
          cd backend
          PYTHONPATH=. pytest tests/unit/test_quality/test_client_generation_drift.py tests/unit/test_quality/test_openapi_drift.py -v

  flutter-test:
    name: Flutter Web & Mobile Client Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Test Suite
        run: flutter test --coverage

  publish-ghcr:
    name: Build & Publish Container Image to GHCR
    needs: [backend-test, generate-client, flutter-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sigadbackend
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
