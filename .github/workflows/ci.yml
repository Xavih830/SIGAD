name: SIGAD CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Verification & 37 Tests Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigad
          POSTGRES_PASSWORD: sigad_dev_2024
          POSTGRES_DB: sigad_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa libtesseract-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov locust httpx

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://sigad:sigad_dev_2024@localhost:5432/sigad_db
          DATABASE_SYNC_URL: postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_db
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Full 37 Mandatory Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://sigad:sigad_dev_2024@localhost:5432/sigad_db
          DATABASE_SYNC_URL: postgresql://sigad:sigad_dev_2024@localhost:5432/sigad_db
          JWT_SECRET_KEY: test-secret-key-32-chars-minimum-prod!
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing

      - name: OpenAPI Contract Export & Drift Verification
        run: |
          python backend/scripts/export_openapi.py
          git diff --exit-code openapi.json

  flutter-test:
    name: Flutter Web & Mobile Client Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Test Suite
        run: flutter test --coverage
